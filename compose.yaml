name: adguardhome-sync

x-daemonless:
  title: "AdGuardHome Sync"
  icon: ":simple-adguard:"
  category: "Network"
  description: "Sync AdGuardHome configuration to replica instances."
  upstream_url: "https://github.com/bakito/adguardhome-sync"
  web_url: "https://github.com/bakito/adguardhome-sync"
  freshports_url: ""
  user: "bsd"
  mlock: false
  upstream_binary: true

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
      ORIGIN_URL: "The AdGuard Home to copy from (e.g. http://192.168.1.2:3000)"
      ORIGIN_USERNAME: "Its admin user"
      ORIGIN_PASSWORD:
        desc: "Its admin password"
        generate: false  # yours, from AdGuard Home: fjord must not make one up
      REPLICA1_URL: "The AdGuard Home to copy to (more: REPLICA2_URL, ...)"
      REPLICA1_USERNAME: "Its admin user"
      REPLICA1_PASSWORD:
        desc: "Its admin password"
        generate: false  # yours, from AdGuard Home: fjord must not make one up
      CRON:
        desc: "When to sync, cron syntax (empty: only at start)"
        optional: true
    volumes:
      /config: "Configuration directory; an adguardhome-sync.yaml here works instead of the variables"
    ports:
      8080: "Metrics/API"

services:
  adguardhome-sync:
    image: ghcr.io/daemonless/adguardhome-sync:latest
    container_name: adguardhome-sync
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - ORIGIN_URL=
      - ORIGIN_USERNAME=
      - ORIGIN_PASSWORD=
      - REPLICA1_URL=
      - REPLICA1_USERNAME=
      - REPLICA1_PASSWORD=
      - CRON=*/10 * * * *

    volumes:
      - /path/to/containers/adguardhome-sync:/config

    ports:
      - "8080:8080"
